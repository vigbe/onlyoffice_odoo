name: Deploy Odoo Module

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENV=prod" >> $GITHUB_OUTPUT
            echo "Environment set to PRODUCTION"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "ENV=test" >> $GITHUB_OUTPUT
            echo "Environment set to TEST"
          fi

      - name: Process Credential Secret
        id: process_creds
        shell: python
        env:
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          import os
          import base64
          import json
          import hashlib

          secret = os.environ.get('SA_KEY', '').strip()
          final_secret = None

          # Try to load as JSON directly
          try:
              json.loads(secret)
              print("Detected valid JSON secret.")
              final_secret = secret
          except json.JSONDecodeError:
              print("Secret is not valid JSON. Trying Base64 decode...")
              
          # Try to decode from Base64
          if final_secret is None:
              try:
                  decoded = base64.b64decode(secret).decode('utf-8')
                  json.loads(decoded) # Validate result is JSON
                  print("Detected valid Base64-encoded JSON secret.")
                  final_secret = decoded
              except Exception as e:
                  print(f"Error: Secret is neither valid JSON nor valid Base64 encoded JSON.")
                  print(f"Details: {e}")
                  exit(1)

          # If we reached here, final_secret should contain valid JSON
          if final_secret is None:
              print("Error: Could not process secret into valid JSON.")
              exit(1)

          # Debugging: Print SHA256 of the content
          print(f"DEBUG: Content size: {len(final_secret)} bytes")
          print(f"DEBUG: SHA256: {hashlib.sha256(final_secret.encode('utf-8')).hexdigest()}")
          print(f"DEBUG: First 10 chars (hex): {final_secret[:10].encode('utf-8').hex()}")
          print(f"DEBUG: First 50 chars: {final_secret[:50]}")

          # Write to GITHUB_OUTPUT
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"CREDENTIALS_JSON<<EOF\n{final_secret}\nEOF\n")

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ steps.process_creds.outputs.CREDENTIALS_JSON }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to GCP VM via IAP
        run: |
          # Extract repository name as module name
          REPO_NAME=$(basename "${{ github.repository }}")
          ENVIRONMENT="${{ steps.env.outputs.ENV }}"

          echo "🚀 Triggering deployment for $REPO_NAME to $ENVIRONMENT"

          # SSH command using IAP tunnel as user 'vigbe' to ensure correct permissions
          # Note: Host checking is disabled to avoid interactive prompts in CI
          gcloud compute ssh vigbe@odoo-app-01 \
            --project=odoo-ia-prop-com \
            --zone=southamerica-west1-b \
            --tunnel-through-iap \
            --command="cd ~/odoo_deploy_files && ./deploy_module.sh \"$REPO_NAME\" \"$ENVIRONMENT\""
